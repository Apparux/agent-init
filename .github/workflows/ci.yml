name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  posix-test:
    name: ${{ matrix.os }} / Node 18
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18
          cache: npm
      - run: npm test

  windows-smoke:
    name: Windows Native / Node 18 smoke and recovery
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18
          cache: npm
      - run: node --test tests/cli/ tests/installation/

  package:
    name: Package / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm test
      - name: Check JavaScript syntax
        run: find bin src scripts tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify release manifest is current
        run: node scripts/release-manifest.js --check
      - run: npm pack --dry-run
