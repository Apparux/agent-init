name: Deprecate legacy npm package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecate:
    name: Deprecate @apparux/agent-project-setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Deprecate all versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          for version in 0.1.0 0.1.1 0.1.2 0.1.3-rc.0; do
            echo "Deprecating @apparux/agent-project-setup@$version"
            npm deprecate "@apparux/agent-project-setup@$version" \
              "Renamed to @apparux/agent-init. Run: npx @apparux/agent-project-setup@latest uninstall && npx @apparux/agent-init@latest install" || \
              { echo "Failed for $version"; exit 1; }
          done
      - name: Verify deprecation notice
        run: |
          for version in 0.1.0 0.1.1 0.1.2 0.1.3-rc.0; do
            notice=$(npm view "@apparux/agent-project-setup@$version" deprecated)
            echo "$version: $notice"
            test -n "$notice"
          done
